<path class="lead" d="M232 92 L364 118"/><text class="lbl" x="226" y="98" text-anchor="end">Superior vena cava</text>
<path class="lead" d="M200 300 L300 360"/><text class="lbl" x="194" y="300" text-anchor="end">Right atrium</text>
