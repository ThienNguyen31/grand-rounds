<path class="lead" d="M200 820 L226 820"/><text class="lbl" x="194" y="827" text-anchor="end">Inferior vena cava</text>
<path class="lead" d="M904 64 L770 104"/><text class="lbl" x="910" y="70">Aortic arch</text>
<path class="lead" d="M904 196 L790 250"/><text class="lbl" x="910" y="200">Pulmonary artery</text>
<path class="lead" d="M1022 300 L830 340"/><text class="lbl" x="1028" y="306">Left atrium</text>
<text class="lbl" x="1028" y="412">Pulmonary veins</text>
<path class="lead" d="M1022 520 L790 570"/><text class="lbl" x="1028" y="526">Mitral valve</text>
<path class="lead" d="M1022 680 L790 660"/><text class="lbl" x="1028" y="686">Left ventricle</text>
<path class="lead" d="M760 880 L598 790"/><text class="lbl" x="766" y="886">Interventricular septum</text>
</svg>
