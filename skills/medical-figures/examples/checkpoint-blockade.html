<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD-1/PD-L1 checkpoint blockade: looping motion graphic</title>
<!-- Reference implementation for motion.md, "Looping motion graphics". Schematic, not to scale.
     Open in a browser: it plays and loops like a video, but it is vector, editable and
     a few kilobytes. In a deck, the engine adds class "play" to the active slide. -->
<style>html,body{margin:0;height:100%;background:#fff}body{display:grid;place-items:center}svg{width:min(96vw,160vh);height:auto}</style>
</head>
<body class="play">
<svg viewBox="150 95 1300 810" class="mech" data-poster="0.6" role="img" font-family="Arial, Helvetica, sans-serif"
     aria-label="Animated schematic of PD-1/PD-L1 checkpoint blockade: antigen recognition, PD-L1 inhibition, anti-PD-1 blockade, tumour cell killing">
<style>
  /* Looping motion graphic (16 s). Only transform and opacity animate. It runs while an
     ancestor has class "play" (the deck engine sets it on the active slide). The static
     state without animation is the poster frame: antibody bound, T cell active. */
  .mech text { fill:#1B2430 }
  .mech .lbl { font-size:24px; fill:#4A5563 }
  .mech .lead { stroke:#9AA3AE; stroke-width:1.5; fill:none }
  .mech .cap { font-size:34px; text-anchor:middle; opacity:0 }
  .mech .c3 { opacity:1 }
  .mech .tumor, .mech .tbody, .mech .ab, .mech .pdl1, .mech .brake, .mech .glow, .mech .gran, .mech .bleb,
  .mech .flash, .mech .inh, .mech .scene, .mech .cap, .mech .prog { transform-box:fill-box }
  .mech .brake, .mech .flash, .mech .inh, .mech .gran, .mech .bleb { opacity:0 }
  .mech .prog { transform-origin:left center; transform:scaleX(.6) }
  .mech .tumor-cell { transform-box:fill-box; transform-origin:center }

  .play .mech .scene     { animation: m-scene 16s linear infinite }
  .play .mech .tumor     { animation: m-tumor 16s cubic-bezier(.25,.7,.25,1) infinite }
  .play .mech .tumor-cell{ animation: m-death 16s ease infinite }
  .play .mech .pdl1      { animation: m-pdl1 16s ease infinite }
  .play .mech .glow      { animation: m-glow 16s ease infinite }
  .play .mech .tbody     { animation: m-dim 16s ease infinite }
  .play .mech .brake     { animation: m-brake 16s ease infinite }
  .play .mech .flash     { animation: m-flash 16s ease-out infinite }
  .play .mech .inh       { animation: m-inh 16s linear infinite }
  .play .mech .inh.i2    { animation-name: m-inh2 }
  .play .mech .inh.i3    { animation-name: m-inh3 }
  .play .mech .ab        { animation: m-ab 16s cubic-bezier(.25,.7,.25,1) infinite }
  .play .mech .gran      { animation: m-gran 16s cubic-bezier(.4,0,.2,1) infinite }
  .play .mech .gran:nth-of-type(2) { animation-name: m-gran2 }
  .play .mech .gran:nth-of-type(3) { animation-name: m-gran3 }
  .play .mech .bleb      { animation: m-bleb 16s ease-out infinite }
  .play .mech .c1 { animation: m-c1 16s linear infinite }
  .play .mech .c2 { animation: m-c2 16s linear infinite }
  .play .mech .c3 { animation: m-c3 16s linear infinite }
  .play .mech .c4 { animation: m-c4 16s linear infinite }
  .play .mech .prog { animation: m-prog 16s linear infinite }

  @keyframes m-scene { 0%{opacity:0} 3%{opacity:1} 96%{opacity:1} 100%{opacity:0} }
  @keyframes m-tumor { 0%,6%{transform:translateX(260px)} 20%,100%{transform:none} }
  @keyframes m-death { 0%,74%{transform:none;opacity:1} 86%,100%{transform:scale(.88);opacity:.38} }
  @keyframes m-pdl1  { 0%,32%{transform:none} 36%,52%{transform:translateX(-24px)} 56%,100%{transform:none} }
  @keyframes m-glow  { 0%,20%{opacity:0} 26%,36%{opacity:1} 40%,54%{opacity:0} 58%,92%{opacity:1} 96%,100%{opacity:0} }
  @keyframes m-dim   { 0%,38%{opacity:1} 42%,53%{opacity:.45} 57%,100%{opacity:1} }
  @keyframes m-brake { 0%,38%{opacity:0;transform:scale(.6)} 41%,52%{opacity:1;transform:none} 55%,100%{opacity:0;transform:none} }
  @keyframes m-flash { 0%,19%{opacity:0;transform:scale(.4)} 21%{opacity:1} 27%,100%{opacity:0;transform:scale(1.8)} }
  @keyframes m-inh   { 0%,37%{opacity:0;transform:none} 38%{opacity:1} 46%{opacity:1;transform:translate(-130px,-60px)} 47%,100%{opacity:0;transform:translate(-130px,-60px)} }
  @keyframes m-inh2  { 0%,40%{opacity:0;transform:none} 41%{opacity:1} 49%{opacity:1;transform:translate(-130px,-60px)} 50%,100%{opacity:0;transform:translate(-130px,-60px)} }
  @keyframes m-inh3  { 0%,43%{opacity:0;transform:none} 44%{opacity:1} 52%{opacity:1;transform:translate(-130px,-60px)} 53%,100%{opacity:0;transform:translate(-130px,-60px)} }
  @keyframes m-ab    { 0%,49%{opacity:0;transform:translate(40px,260px)} 52%{opacity:1} 57%,95%{opacity:1;transform:none} 98%,100%{opacity:0;transform:none} }
  @keyframes m-gran  { 0%,67%{opacity:0;transform:none} 68%{opacity:1} 76%{opacity:1;transform:translateX(250px)} 79%,100%{opacity:0;transform:translateX(250px)} }
  @keyframes m-gran2 { 0%,69%{opacity:0;transform:none} 70%{opacity:1} 78%{opacity:1;transform:translateX(240px)} 81%,100%{opacity:0;transform:translateX(240px)} }
  @keyframes m-gran3 { 0%,71%{opacity:0;transform:none} 72%{opacity:1} 80%{opacity:1;transform:translateX(255px)} 83%,100%{opacity:0;transform:translateX(255px)} }
  @keyframes m-bleb  { 0%,78%{opacity:0;transform:none} 82%{opacity:1} 92%{opacity:.8;transform:translate(var(--bx),var(--by))} 96%,100%{opacity:0;transform:translate(var(--bx),var(--by))} }
  @keyframes m-c1 { 0%,3%{opacity:0} 5%,29%{opacity:1} 31%,100%{opacity:0} }
  @keyframes m-c2 { 0%,31%{opacity:0} 33%,53%{opacity:1} 55%,100%{opacity:0} }
  @keyframes m-c3 { 0%,55%{opacity:0} 57%,67%{opacity:1} 69%,100%{opacity:0} }
  @keyframes m-c4 { 0%,69%{opacity:0} 71%,94%{opacity:1} 96%,100%{opacity:0} }
  @keyframes m-prog { from{transform:scaleX(0)} to{transform:scaleX(1)} }
  @media (prefers-reduced-motion:reduce) { .mech *, .mech { animation:none !important } }
</style>

<g class="scene">
  <!-- T cell -->
  <circle class="glow" cx="400" cy="430" r="232" fill="none" stroke="#0F7C8A" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/>
  <g class="tbody">
    <circle cx="400" cy="430" r="210" fill="#DDF0F2" stroke="#0F7C8A" stroke-width="5"/>
    <circle cx="360" cy="450" r="78" fill="#BFE2E7"/>
    <text x="360" y="460" font-size="30" text-anchor="middle" font-weight="700">T cell</text>
  </g>
  <!-- brake (inhibition) -->
  <g class="brake" style="transform-origin:center">
    <circle cx="470" cy="300" r="38" fill="#fff" stroke="#D9731F" stroke-width="6"/>
    <path d="M446 300h48" stroke="#D9731F" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- TCR and PD-1 on the T-cell membrane -->
  <path d="M579 320h44M623 320l26 -16M623 320l26 16" stroke="#0F7C8A" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M572 550h50" stroke="#3D5A99" stroke-width="11" stroke-linecap="round"/>
  <circle cx="637" cy="550" r="14" fill="#3D5A99"/>
  <!-- inhibitory signal into the T cell -->
  <circle class="inh" cx="600" cy="548" r="9" fill="#D9731F"/>
  <circle class="inh i2" cx="600" cy="548" r="9" fill="#D9731F"/>
  <circle class="inh i3" cx="600" cy="548" r="9" fill="#D9731F"/>
  <!-- cytotoxic granules -->
  <circle class="gran" cx="560" cy="390" r="12" fill="#0F7C8A"/>
  <circle class="gran" cx="548" cy="440" r="10" fill="#0F7C8A"/>
  <circle class="gran" cx="560" cy="480" r="11" fill="#0F7C8A"/>

  <!-- tumour cell with MHC–antigen and PD-L1 (drifts in) -->
  <g class="tumor">
    <g class="tumor-cell">
      <ellipse cx="990" cy="430" rx="270" ry="240" fill="#F8E3E7" stroke="#B8475A" stroke-width="5"/>
      <circle cx="1040" cy="450" r="70" fill="#F0C9D1"/>
      <text x="1040" y="460" font-size="30" text-anchor="middle" font-weight="700">Tumour cell</text>
    </g>
    <circle class="bleb" style="--bx:120px;--by:-90px" cx="1180" cy="300" r="16" fill="#E9B7C1"/>
    <circle class="bleb" style="--bx:150px;--by:40px" cx="1250" cy="460" r="13" fill="#E9B7C1"/>
    <circle class="bleb" style="--bx:80px;--by:110px" cx="1150" cy="610" r="15" fill="#E9B7C1"/>
    <path d="M750 320h-46M704 320v-18M704 320v18" stroke="#B8475A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="672" cy="320" r="10" fill="#B8475A"/>
    <g class="pdl1">
      <path d="M756 550h-62" stroke="#D9822B" stroke-width="11" stroke-linecap="round"/>
      <path d="M680 532a18 18 0 0 1 0 36" stroke="#D9822B" stroke-width="9" fill="none" stroke-linecap="round"/>
    </g>
    <path class="lead" d="M850 150L700 300"/>
    <text class="lbl" x="855" y="150">MHC + tumour antigen</text>
    <path class="lead" d="M792 694L692 572"/>
    <text class="lbl" x="798" y="708">PD-L1</text>
  </g>
  <!-- synapse flash when the TCR engages -->
  <circle class="flash" cx="660" cy="320" r="34" fill="none" stroke="#0F7C8A" stroke-width="5" style="transform-origin:center"/>

  <!-- anti-PD-1 antibody docks on PD-1 from below -->
  <g class="ab">
    <path d="M637 660v-52M637 608l-17 -36M637 608l17 -36" stroke="#6A3FA0" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="lead" d="M660 742L640 668"/>
    <text class="lbl" x="664" y="760" style="fill:#6A3FA0">anti-PD-1 antibody</text>
  </g>

  <!-- fixed labels on the T-cell side -->
  <path class="lead" d="M520 150L626 306"/>
  <text class="lbl" x="514" y="150" text-anchor="end">T-cell receptor (TCR)</text>
  <path class="lead" d="M492 694L600 562"/>
  <text class="lbl" x="486" y="708" text-anchor="end">PD-1</text>
</g>

<!-- captions, one per stage, and a progress line like a video -->
<text class="cap c1" x="800" y="850">The T-cell receptor recognises a tumour antigen on MHC</text>
<text class="cap c2" x="800" y="850">PD-L1 binds PD-1 and switches the T cell off</text>
<text class="cap c3" x="800" y="850">Anti-PD-1 occupies PD-1, so PD-L1 cannot bind</text>
<text class="cap c4" x="800" y="850">Released, the T cell kills the tumour cell</text>
<line x1="500" x2="1100" y1="880" y2="880" stroke="#E3E6EA" stroke-width="4" stroke-linecap="round"/>
<line class="prog" x1="500" x2="1100" y1="880" y2="880" stroke="#0F7C8A" stroke-width="4" stroke-linecap="round"/>
</svg>

</body>
</html>
